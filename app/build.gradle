plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jordan.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.jordan.launcher"
        minSdk 22
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
